name: iRx Windows Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: irx-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DIRX_FETCH_ASSETS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Self-test
        run: .\build\Release\iRx.exe --self-test
      - name: Install portable package
        run: cmake --install build --config Release --prefix dist/iRx
      - name: Pack assets
        shell: pwsh
        run: |
          python tools/pack_assets.py dist/iRx/assets dist/iRx/packed --chunk-mb 48
      - name: Add runtime files
        shell: pwsh
        run: |
          Copy-Item README.md dist/iRx/README.md
          Copy-Item LICENSE dist/iRx/LICENSE.txt
          @'
          @echo off
          cd /d "%~dp0"
          start "" iRx.exe
          '@ | Set-Content -Encoding ascii dist/iRx/PLAY.bat
      - name: Install UPX
        shell: pwsh
        run: choco install upx -y --no-progress
      - name: Compress executable
        shell: pwsh
        run: |
          upx --best --lzma dist/iRx/iRx.exe
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build installer script
        shell: pwsh
        run: |
          @'
          [Setup]
          AppName=iRx
          AppVersion=0.3.${{ github.run_number }}
          DefaultDirName={autopf}\iRx
          DefaultGroupName=iRx
          OutputDir=.
          OutputBaseFilename=iRx-Setup-Windows-x64
          Compression=lzma2/ultra64
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          [Files]
          Source: "dist\iRx\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{autoprograms}\iRx"; Filename: "{app}\iRx.exe"
          Name: "{autodesktop}\iRx"; Filename: "{app}\iRx.exe"
          [Run]
          Filename: "{app}\iRx.exe"; Description: "Launch iRx"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Encoding utf8 installer.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/iRx/* -DestinationPath iRx-Windows-x64.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iRx-Windows-x64
          path: |
            iRx-Windows-x64.zip
            iRx-Setup-Windows-x64.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.${{ github.run_number }}
          name: iRx v0.3.${{ github.run_number }}
          body: |
            Windows x64 build of iRx.
            Includes portable ZIP, installer, licensed asset package and compressed executable.
            Multiplayer target: irautox.ir:9832.
          files: |
            iRx-Windows-x64.zip
            iRx-Setup-Windows-x64.exe
          generate_release_notes: true
          make_latest: true
